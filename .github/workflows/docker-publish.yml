name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# 推送镜像到 GitHub Packages (GHCR) 需要 packages:write 权限
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 推送到 main 且镜像构建成功后，SSH 登录服务器自动部署
  # 需要在 GitHub 仓库 Settings → Secrets and variables → Actions
  # 配置以下 Secrets（详见 README“自动部署”章节）：
  #   SSH_HOST       服务器 IP 或域名（必填）
  #   SSH_USERNAME   SSH 登录用户（必填，如 root / ubuntu）
  #   SSH_KEY        SSH 私钥完整内容（必填，建议专用部署密钥）
  #   SSH_PORT       SSH 端口（可选，默认 22）
  #   DEPLOY_DIR     服务器部署目录（可选，默认 /opt/cims）
  #   DEPLOY_ENV     完整 .env 文件内容（可选；提供则每次部署覆盖服务器 .env）
  #   APP_PORT       宿主机对外访问端口（可选，默认 8000；容器内固定 8000）
  #   GHCR_PAT       拉取私有镜像包用的 PAT（read:packages）；镜像包公开则可不配
  # ============================================================
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    # 推送 main 或手动 workflow_dispatch 时执行部署；Secrets 上下文不允许出现在 job.if 中，
    # 因此是否实际部署由下方“Check required secrets”步骤决定（未配置则安全跳过）
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check required secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USERNAME" ] || [ -z "$SSH_KEY" ]; then
            echo "未配置 SSH Secrets（SSH_HOST / SSH_USERNAME / SSH_KEY），跳过本次部署。"
            echo "::notice::配置好上述 Secrets 后，下一次推送 main 或手动 Re-run 即可触发部署。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v6

      - name: Upload docker-compose.yml to server
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_DIR || '/opt/cims' }}
          overwrite: true

      - name: Deploy over SSH
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/cims' }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          APP_PORT: ${{ secrets.APP_PORT }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_DIR,DEPLOY_ENV,APP_PORT,GHCR_PAT,GHCR_USER,REPO_NAME
          script: |
            set -euo pipefail
            # 可选 Secret 为空时兜底，避免 set -u 报未绑定变量
            DEPLOY_ENV="${DEPLOY_ENV:-}"
            APP_PORT="${APP_PORT:-}"
            GHCR_PAT="${GHCR_PAT:-}"
            cd "$DEPLOY_DIR"

            if [ -n "$DEPLOY_ENV" ]; then
              umask 077
              printf '%s' "$DEPLOY_ENV" > .env
              echo "已通过 DEPLOY_ENV Secret 写入 .env"
            else
              echo "未配置 DEPLOY_ENV Secret，沿用服务器现有 .env"
            fi
            test -f .env || { echo "部署失败：$DEPLOY_DIR 下不存在 .env，且未配置 DEPLOY_ENV"; exit 1; }
            grep -q '^IMAGE_URL=' .env || echo "提醒：.env 中建议包含 IMAGE_URL=ghcr.io/$GHCR_USER/$REPO_NAME:latest"

            # 宿主机对外端口优先级：APP_PORT Secret > 服务器 .env > 默认 8000
            if [ -n "$APP_PORT" ]; then
              export APP_PORT
            else
              env_port="$(grep -E '^APP_PORT=' .env | tail -n1 | cut -d= -f2 || true)"
              export APP_PORT="${env_port:-8000}"
            fi
            echo "本次部署宿主机端口：$APP_PORT -> 容器 8000"

            if [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            docker compose pull
            docker compose up -d --remove-orphans

            echo "等待服务启动并做健康检查（端口 $APP_PORT）..."
            sleep 6
            curl -fsS --retry 5 --retry-delay 3 "http://127.0.0.1:$APP_PORT/health"
            echo ""
            echo "部署成功 ✅"

            docker image prune -f
